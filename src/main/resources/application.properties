spring.application.name=smartfarm-backend

# 로컬에서는 프로젝트 루트의 .env를 읽고, 서버에서는 환경 변수를 쓴다.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartfarm}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 스키마가 9/29 회의에서 확정되기 전까지는 엔티티 기준으로 자동 반영한다.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# 팀원이 서버가 살아 있는지 확인할 수 있게 health만 공개한다.
management.endpoints.web.exposure.include=health
