spring.application.name=smartfarm-backend

# 로컬에서는 프로젝트 루트의 .env를 읽고, 서버에서는 환경 변수를 쓴다.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartfarm}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 스키마가 9/29 회의에서 확정되기 전까지는 엔티티 기준으로 자동 반영한다.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# 팀원이 서버가 살아 있는지 확인할 수 있게 health만 공개한다.
management.endpoints.web.exposure.include=health

# smartfarm-ai(FastAPI) 진단 서비스 (API-005). 추론이 CPU에서는 몇 초 걸릴 수 있어 읽기 타임아웃을 넉넉히 둔다.
ai.service.base-url=${AI_SERVICE_URL:http://localhost:8000}
# AI 서버가 외부에 열려 있으면 API_KEY와 같은 값을 넣는다. 비어 있으면 헤더를 보내지 않는다.
ai.service.api-key=${AI_SERVICE_API_KEY:}
ai.service.connect-timeout-ms=5000
ai.service.read-timeout-ms=30000

# API-008 기기 토큰. 서명 키는 32바이트 이상이어야 하고 서버에서는 환경 변수로만 넣는다.
jwt.secret=${JWT_SECRET:}
jwt.expires-in-seconds=3600

# 서버 시작 시 등록할 개발용 기기의 비밀값. 비어 있으면 기기를 등록하지 않는다.
seed.gateway-secret=${SEED_GATEWAY_SECRET:}

# 텔레메트리는 받을 때마다 최신값을 갱신하고, DB 이력은 이 간격(초)마다 한 건만 저장한다.
telemetry.history-interval-seconds=${TELEMETRY_HISTORY_INTERVAL_SECONDS:60}

# API-004 사진 파일 저장 위치. 서버에서는 compose.prod.yaml의 볼륨이 이 경로(/app/data/images)에 붙는다.
image.storage-dir=${IMAGE_STORAGE_DIR:data/images}
# 사진을 받으면 AI 진단을 백그라운드에서 한 장씩 처리한다. 대기열이 차면 그 사진은 진단하지 않는다.
diagnosis.queue-capacity=${DIAGNOSIS_QUEUE_CAPACITY:50}
